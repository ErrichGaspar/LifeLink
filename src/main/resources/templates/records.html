<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLink | Donation Records</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/assessment.css"></head><body class="dashboard-page"><div class="background-image"><img src="/images/bg.png" alt=""></div><main class="content form-content"><div th:if="${success}" class="notice success" th:text="${success}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div><section class="assessment-card"><p class="eyebrow">ADMIN</p><h1>Record Donation</h1><form action="/records" method="post"><div class="question-grid"><label>Donor<select name="userId" required><option value="">Select donor</option><option th:each="donor:${donors}" th:value="${donor.id}" th:text="${donor.firstName+' '+donor.lastName}"></option></select></label><label>Donation date<input type="date" name="donationDate" required></label><label>Blood type<select name="bloodType" required><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label><label>Units<input type="number" name="units" min="1" value="1" required></label></div><button class="primary-button">Record Completed Donation</button></form></section><section class="assessment-card"><h2>Donation History</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Donor ID</th><th>Type</th><th>Units</th><th>Status</th><th>Next eligible</th></tr></thead><tbody><tr th:each="donation:${donations}"><td th:text="${donation.donationDate}"></td><td th:text="${donation.userId}"></td><td th:text="${donation.bloodType}"></td><td th:text="${donation.units}"></td><td th:text="${donation.status}"></td><td th:text="${donation.nextEligibleDate}"></td></tr></tbody></table></div></section></main></body></html>
