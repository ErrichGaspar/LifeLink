<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLink | Donation Records</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/assessment.css"></head><body class="dashboard-page"><div class="background-image"><img src="/images/bg.png" alt=""></div><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar(${admin}, ${activePage})}"></aside><main class="content form-content"><div th:if="${success}" class="notice success" th:text="${success}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div><section class="assessment-card"><p class="eyebrow">ADMIN</p><h1>Record Walk-in Donation</h1><form action="/records" method="post"><div class="question-grid"><label>Donor<select name="userId" required><option value="">Select donor</option><option th:each="donor:${donors}" th:value="${donor.id}" th:text="${donor.donorId+' · '+donor.firstName+' '+donor.lastName}"></option></select></label><label>Donation date<input type="date" name="donationDate" th:attr="max=${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}" required></label><label>Collected bags<input type="number" name="units" min="1" max="10" value="1" required></label><label>Location<input name="location" maxlength="160"></label></div><button class="primary-button">Record Collected Donation</button></form></section><section class="assessment-card"><h2>Donation History</h2><p>Collected bags enter available inventory only after an administrator accepts them.</p><div class="table-wrap"><table><thead><tr><th>Date</th><th>Donor ID / Name</th><th>Type</th><th>Collected bags</th><th>Status</th><th>Inventory</th><th>Next eligible</th></tr></thead><tbody><tr th:each="donation:${donations}"><td th:text="${donation.donationDate}"></td><td th:text="${donorNames[donation.userId] != null ? donorNames[donation.userId] : 'Unknown donor'}"></td><td th:text="${donation.bloodType}"></td><td th:text="${donation.units}"></td><td th:text="${donation.status}"></td><td><span th:text="${donation.inventoryAccepted ? 'Accepted' : 'Awaiting acceptance'}"></span><form th:if="${donation.status=='COMPLETED' and !donation.inventoryAccepted}" th:action="@{/records/{id}/accept(id=${donation.id})}" method="post"><button class="primary-button" type="submit">Accept bags</button></form></td><td th:text="${donation.nextEligibleDate}"></td></tr><tr th:if="${#lists.isEmpty(donations)}"><td colspan="7">No completed donation records yet.</td></tr></tbody></table></div></section></main></div><script src="/js/theme.js"></script></body></html>
