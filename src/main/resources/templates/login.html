<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifeLink | Login</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">

</head>

<body>

    <div class="background-image">
        <img
            src="/images/bg.png"
            alt="LifeLink Background"
        >
    </div>


    <div class="site-wrapper">


        <!-- NAVIGATION BAR -->

        <header class="navbar">


            <a href="/" class="logo-link">

                <img
                    src="/images/logo.png"
                    alt="LifeLink Blood Logo"
                    class="logo-image"
                >

                <span class="logo-text">LifeLink</span>

            </a>


            <nav class="nav-menu">

                <a href="/" class="nav-link">
                    HOME
                </a>

                <a href="/#about" class="nav-link">
                    ABOUT
                </a>

                <a href="/#features" class="nav-link">
                    FEATURES
                </a>

                <a href="/#contact" class="nav-link">
                    CONTACT
                </a>

                <a href="/login" class="nav-link login-link active">
                    LOG IN
                </a>

            </nav>


            <button
                class="theme-toggle"
                type="button"
                aria-label="Toggle theme"
            >
                <span></span>
            </button>


        </header>


        <!-- LOGIN FORM -->

        <main class="login-page">

            <section class="login-container">

                <div class="login-right">

                    <h1>Login</h1>

                    <p>Access your account to continue.</p>

                    <form class="login-form" action="/login" method="post">

                        <div class="form-group">

                            <label for="username">Username</label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                            >

                            <small class="error-message" id="username-error"></small>

                        </div>

                        <div class="form-group">

                            <label for="password">Password</label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                >

                            
                            </div>

                            <small class="error-message" id="password-error"></small>

                        </div>


                        <p th:if="${error}" class="server-error" th:text="${error}">Invalid username or password.</p>

                        <!-- PASSWORD VISIBILITY + REMEMBER ME -->

                        <div class="login-options">

                            <label>
                                <input type="checkbox" id="view-password">
                                View password
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="remember"
                                >
                                Remember me
                            </label>

                        </div>


                        <button type="submit" class="login-button">
                            ➜ &nbsp; LOGIN
                        </button>


                        <!-- DIVIDER -->

                        <div class="login-divider">

                            <span></span>

                            <b>or</b>

                            <span></span>

                        </div>


                        <!-- REGISTER -->

                        <div class="register-link">

                            <span>👤 + &nbsp; Don't have an account?</span>

                            <a href="/register">
                                Register here
                            </a>

                        </div>


                    </form>

                </div>

                <div class="login-content">

                    <img
                        src="/images/welcome.png"
                        alt="Welcome to LifeLink"
                        class="welcome-image"
                    >

                </div>

            </section>

        </main>

    </div>

    <script src="/js/login.js"></script>
    
    <script src="/js/theme.js"></script>

</body>

</html>
