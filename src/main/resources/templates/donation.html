<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLink | Donation Schedules</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/assessment.css"></head><body class="dashboard-page"><div class="background-image"><img src="/images/bg.png" alt=""></div><div class="app-shell"><aside class="sidebar"><div class="donor-profile"><div class="big-avatar"><i class="fa-solid fa-user"></i></div><div class="profile-copy"><h3 th:text="${firstName}">User</h3><p>LifeLink</p></div></div><nav class="menu"><a href="/dashboard"><i class="fa-solid fa-house"></i><span>Dashboard</span></a><a href="/donors"><i class="fa-solid fa-users"></i><span>Donor Information</span></a><a href="/assessment"><i class="fa-solid fa-heart-pulse"></i><span>Eligibility / Status</span></a><a href="/donation" class="active"><i class="fa-solid fa-calendar-days"></i><span th:text="${admin?'Appointment Management':'Schedule Donation'}">Schedule Donation</span></a><a href="/reports"><i class="fa-solid fa-file-lines"></i><span>Donation History</span></a></nav><a class="logout" href="/logout">Log out</a></aside><main class="content form-content"><div th:if="${success}" class="notice success" th:text="${success}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div><section th:unless="${admin}" class="assessment-card"><p class="eyebrow">DONATION SCHEDULING</p><h1>Schedule Donation</h1><form action="/donation" method="post"><div class="question-grid"><label>Date<input type="date" name="appointmentDate" th:attr="min=${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}" required></label><label>Time<input type="time" name="appointmentTime" required></label><label>Donation location<input name="location" maxlength="160" placeholder="LifeLink Donation Center"></label></div><button class="primary-button">Schedule Appointment</button></form></section><section class="assessment-card"><h2 th:text="${admin?'Donation Schedules':'My Appointments'}">Appointments</h2><div class="table-wrap"><table><thead><tr><th th:if="${admin}">Donor</th><th>Date</th><th>Time</th><th>Location</th><th>Status</th><th>Manage</th></tr></thead><tbody><tr th:each="appointment:${appointments}"><td th:if="${admin}" th:text="${donorNames[appointment.userId] != null ? donorNames[appointment.userId] : 'Unknown donor'}"></td><td th:text="${appointment.appointmentDate}"></td><td th:text="${appointment.appointmentTime}"></td><td th:text="${appointment.location}"></td><td th:text="${appointment.status}"></td><td><div th:if="${admin}"><form th:action="@{/donation/{id}/status(id=${appointment.id})}" method="post" class="question-grid"><label>Donor<select name="userId" required><option th:each="donor:${donors}" th:value="${donor.id}" th:text="${donorNames[donor.id]}" th:selected="${donor.id == appointment.userId}"></option></select></label><label>Date<input type="date" name="appointmentDate" th:value="${appointment.appointmentDate}" required></label><label>Time<input type="time" name="appointmentTime" th:value="${appointment.appointmentTime}" required></label><label>Location<input name="location" th:value="${appointment.location}" maxlength="160"></label><label>Status<select name="status"><option value="UPCOMING">Scheduled</option><option value="CONFIRMED">Confirmed</option><option value="COMPLETED">Completed</option><option value="CANCELLED">Cancelled</option></select></label><label th:if="${appointment.status!='COMPLETED'}">Collected bags<input type="number" name="collectedUnits" min="1" max="10"></label><button class="primary-button" type="submit">Save schedule</button></form></div><div th:unless="${admin}"><form th:if="${appointment.status=='UPCOMING' or appointment.status=='CONFIRMED'}" th:action="@{/donation/{id}/reschedule(id=${appointment.id})}" method="post" class="question-grid"><label>New date<input type="date" name="appointmentDate" th:attr="min=${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}" required></label><label>New time<input type="time" name="appointmentTime" required></label><button class="secondary-button">Reschedule</button></form><form th:if="${appointment.status=='UPCOMING' or appointment.status=='CONFIRMED'}" th:action="@{/donation/{id}/cancel(id=${appointment.id})}" method="post"><button class="secondary-button">Cancel</button></form></div></td></tr><tr th:if="${#lists.isEmpty(appointments)}"><td th:attr="colspan=${admin?6:5}">No appointments yet.</td></tr></tbody></table></div></section></main></div><script src="/js/theme.js"></script></body></html>
