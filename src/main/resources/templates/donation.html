<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink | Donation Appointments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/assessment.css">
<link rel="stylesheet" href="/css/dashboard-dark.css?v=20261021"></head>
<body class="dashboard-page">
<div class="background-image"><img src="/images/bg.png" alt=""></div>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar(${admin}, ${activePage})}"></aside>
    <main class="content form-content">
        <div th:if="${success}" class="notice success" role="status" th:text="${success}"></div>
        <div th:if="${error}" class="notice error" role="alert" th:text="${error}"></div>

        <section th:unless="${admin}" class="assessment-card">
            <p class="eyebrow">DONATION SCHEDULING</p>
            <h1>Schedule a Donation</h1>
            <div th:if="${canSchedule}" class="status-card">
                <strong>ELIGIBLE</strong>
                <span>Your latest assessment permits you to request an appointment.</span>
            </div>
            <div th:unless="${canSchedule}" class="notice" role="status">
                <strong>Scheduling unavailable</strong>
                <p th:text="${schedulingMessage}">Complete an eligible health assessment before scheduling.</p>
                <a class="secondary-button" href="/assessment">Complete / review assessment</a>
            </div>
            <form th:if="${canSchedule}" action="/donation" method="post">
                <div class="question-grid">
                    <label>Date<input type="date" name="appointmentDate" th:attr="min=${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}" required></label>
                    <label>Time<input type="time" name="appointmentTime" required></label>
                    <label>Donation location<input name="location" maxlength="160" placeholder="Enter a confirmed donation center"></label>
                </div>
                <button class="primary-button" type="submit">Schedule Appointment</button>
            </form>
        </section>

        <section class="assessment-card">
            <h1 th:text="${admin ? 'Appointment Management' : 'My Appointments'}">Appointments</h1>
            <div class="table-wrap">
                <table>
                    <thead><tr><th th:if="${admin}">Donor</th><th>Date</th><th>Time</th><th>Location</th><th>Status</th><th>Manage</th></tr></thead>
                    <tbody>
                    <tr th:each="appointment : ${appointments}">
                        <td th:if="${admin}" th:text="${donorNames[appointment.userId] != null ? donorNames[appointment.userId] : 'Unknown donor'}"></td>
                        <td th:text="${appointment.appointmentDate}"></td>
                        <td th:text="${appointment.appointmentTime}"></td>
                        <td th:text="${appointment.location}"></td>
                        <td><span class="status-badge" th:text="${appointment.status}"></span></td>
                        <td>
                            <form th:if="${admin}" th:action="@{/donation/{id}/status(id=${appointment.id})}" method="post" class="question-grid">
                                <label>Donor<select name="userId" required><option th:each="donor : ${donors}" th:value="${donor.id}" th:text="${donorNames[donor.id]}" th:selected="${donor.id == appointment.userId}"></option></select></label>
                                <label>Date<input type="date" name="appointmentDate" th:value="${appointment.appointmentDate}" required></label>
                                <label>Time<input type="time" name="appointmentTime" th:value="${appointment.appointmentTime}" required></label>
                                <label>Location<input name="location" th:value="${appointment.location}" maxlength="160"></label>
                                <label>Status<select name="status"><option value="UPCOMING" th:selected="${appointment.status == 'UPCOMING'}">Scheduled</option><option value="CONFIRMED" th:selected="${appointment.status == 'CONFIRMED'}">Confirmed</option><option value="COMPLETED" th:selected="${appointment.status == 'COMPLETED'}">Completed</option><option value="CANCELLED" th:selected="${appointment.status == 'CANCELLED'}">Cancelled</option></select></label>
                                <label th:if="${appointment.status != 'COMPLETED' and appointment.status != 'CANCELLED'}">Collected bags<input type="number" name="collectedUnits" min="1" max="10"></label>
                                <button class="primary-button" type="submit">Save appointment</button>
                            </form>
                            <div th:unless="${admin}">
                                <form th:if="${appointment.status == 'UPCOMING' or appointment.status == 'CONFIRMED'}" th:action="@{/donation/{id}/reschedule(id=${appointment.id})}" method="post" class="question-grid">
                                    <label>New date<input type="date" name="appointmentDate" th:attr="min=${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}" required></label>
                                    <label>New time<input type="time" name="appointmentTime" required></label>
                                    <button class="secondary-button" type="submit">Reschedule</button>
                                </form>
                                <form th:if="${appointment.status == 'UPCOMING' or appointment.status == 'CONFIRMED'}" th:action="@{/donation/{id}/cancel(id=${appointment.id})}" method="post">
                                    <button class="secondary-button" type="submit">Cancel appointment</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(appointments)}"><td th:attr="colspan=${admin ? 6 : 5}">No appointments yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="/js/theme.js"></script>
</body>
</html>
