<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLink | Notifications</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/assessment.css"><link rel="stylesheet" href="/css/dashboard-dark.css?v=20261021"><link rel="stylesheet" href="/css/mobile-system.css?v=20261021"></head><body class="dashboard-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar(${admin}, ${activePage})}"></aside><main class="content form-content"><section class="assessment-card"><p class="eyebrow">UPDATES</p><h1>Notifications</h1><article class="status-card" th:each="item : ${notifications}"><div><strong th:text="${item.title}">Update</strong><p th:text="${item.message}">Notification</p><small th:text="${#temporals.format(item.createdAt,'MMM dd, yyyy hh:mm a') + ' Philippine time'}">Time</small><form th:if="${item.readAt == null}" th:action="@{/notifications/{id}/read(id=${item.id})}" method="post"><button type="submit">Mark as read</button></form><small th:if="${item.readAt != null}">Read</small></div></article><p th:if="${#lists.isEmpty(notifications)}">No notifications yet.</p></section></main></div><script src="/js/theme.js"></script></body></html>
