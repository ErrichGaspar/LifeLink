<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLink | Donor Donation History</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/assessment.css"></head><body class="dashboard-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar(${admin}, ${activePage})}"></aside><main class="content form-content"><section class="assessment-card"><p class="eyebrow">DONOR HISTORY</p><h1 th:text="${donor.firstName+' '+donor.lastName}">Donor Name</h1><p>Donor ID: <strong th:text="${donor.donorId}">LL-000001</strong> · Blood type: <strong th:text="${donor.bloodType}">O+</strong></p><p>Most recent donation: <strong th:text="${#lists.isEmpty(donations) ? 'Never donated' : donations[0].donationDate}">Never donated</strong></p><div class="table-wrap"><table><thead><tr><th>Date</th><th>Bags donated</th><th>Location</th><th>Donation record</th><th>Schedule</th></tr></thead><tbody><tr th:each="donation:${donations}"><td th:text="${donation.donationDate}"></td><td th:text="${donation.units}"></td><td th:text="${donation.location != null ? donation.location : 'Not recorded'}"></td><td th:text="${donation.id}"></td><td th:text="${donation.appointmentId != null ? donation.appointmentId : 'Walk-in'}"></td></tr><tr th:if="${#lists.isEmpty(donations)}"><td colspan="5">This donor has no completed donation records.</td></tr></tbody></table></div><a class="primary-button" href="/reports">Back to Donation History</a></section></main></div><script src="/js/theme.js"></script></body></html>
