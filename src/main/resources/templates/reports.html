<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLink | Donation History</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/assessment.css"><link rel="stylesheet" href="/css/dashboard-dark.css?v=20261021"></head><body class="dashboard-page"><div class="background-image"><img src="/images/bg.png" alt=""></div><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar(${admin}, ${activePage})}"></aside><main class="content form-content"><div th:if="${error}" class="notice error" th:text="${error}"></div><section class="assessment-card"><p class="eyebrow" th:text="${admin ? 'ADMIN' : 'DONOR'}">DONATION HISTORY</p><h1>Donation History</h1><div th:if="${admin}" class="table-wrap"><table><thead><tr><th>Donor Name</th><th>Blood Type</th><th>Last Donation Date</th></tr></thead><tbody><tr th:each="donor:${donors}"><td><a th:href="@{/reports/donor/{id}(id=${donor.id})}" th:text="${donor.firstName+' '+donor.lastName}">Donor Name</a></td><td th:text="${donor.bloodType}">O+</td><td th:text="${lastDonation[donor.id] != null ? lastDonation[donor.id] : 'Never donated'}">Never donated</td></tr><tr th:if="${#lists.isEmpty(donors)}"><td colspan="3">No donor records yet.</td></tr></tbody></table></div><div th:unless="${admin}" class="table-wrap"><table><thead><tr><th>Donation date</th><th>Blood type</th><th>Bags donated</th><th>Location</th></tr></thead><tbody><tr th:each="donation:${donations}"><td th:text="${donation.donationDate}"></td><td th:text="${donation.bloodType}"></td><td th:text="${donation.units}"></td><td th:text="${donation.location != null ? donation.location : 'Not recorded'}"></td></tr><tr th:if="${#lists.isEmpty(donations)}"><td colspan="4">No completed donations yet.</td></tr></tbody></table></div><a class="primary-button" href="/dashboard">Return to Dashboard</a></section></main></div><script src="/js/theme.js"></script></body></html>
