<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLink | Blood Requests</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/assessment.css"></head><body class="dashboard-page"><div class="background-image"><img src="/images/bg.png" alt=""></div><main class="content form-content"><div th:if="${success}" class="notice success" th:text="${success}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div><section th:if="${admin}" class="assessment-card"><p class="eyebrow">ADMIN</p><h1>Create Blood Request</h1><form action="/requests" method="post"><div class="question-grid"><label>Patient name<input name="patientName" required></label><label>Hospital<input name="hospital" required></label><label>Blood type<select name="bloodType"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label><label>Units<input type="number" name="units" min="1" required></label><label>Priority<select name="priority"><option>NORMAL</option><option>URGENT</option></select></label></div><button class="primary-button">Create Request</button></form></section><section class="assessment-card"><h1>Blood Requests</h1><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Hospital</th><th>Type</th><th>Units</th><th>Priority</th><th>Status</th><th th:if="${admin}">Manage</th></tr></thead><tbody><tr th:each="request:${requests}"><td th:text="${request.patientName}"></td><td th:text="${request.hospital}"></td><td th:text="${request.bloodType}"></td><td th:text="${request.units}"></td><td th:text="${request.priority}"></td><td th:text="${request.status}"></td><td th:if="${admin}"><form th:action="@{/requests/{id}/status(id=${request.id})}" method="post"><select name="status"><option>PENDING</option><option>APPROVED</option><option>COMPLETED</option></select><button class="primary-button">Update</button></form></td></tr></tbody></table></div></section></main></body></html>
