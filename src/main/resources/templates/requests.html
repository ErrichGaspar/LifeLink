<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeLink | Blood Requests</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/assessment.css"><link rel="stylesheet" href="/css/dashboard-dark.css?v=20261021"><link rel="stylesheet" href="/css/mobile-system.css?v=20261021"></head><body class="dashboard-page"><div class="background-image"><img src="/images/bg.png" alt=""></div><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar(${admin}, ${activePage})}"></aside><main class="content form-content"><div th:if="${success}" class="notice success" th:text="${success}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div><section class="assessment-card"><p class="eyebrow">BLOOD SERVICES</p><h1>Submit a Blood Request</h1><form action="/requests" method="post"><div class="question-grid"><label>Patient name<input name="patientName" maxlength="120" required></label><label>Hospital<input name="hospital" maxlength="160" required></label><label>Requested blood type<select name="bloodType" required><option value="">Select</option><option th:each="type:${bloodTypes}" th:value="${type}" th:text="${type}"></option></select></label><label>Number of bags<input type="number" name="units" min="1" max="100" required></label><label>Date needed<input type="date" name="neededDate" th:attr="min=${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}" required></label><label>Priority<select name="priority"><option value="NORMAL">Normal</option><option value="URGENT">Urgent</option></select></label><label>Reason / indication<input name="reason" maxlength="500"></label></div><button class="primary-button" type="submit">Submit Request</button></form></section><section class="assessment-card"><h2 th:text="${admin?'All Submitted Requests':'Submitted Requests'}">Blood Requests</h2><div class="table-wrap"><table><thead><tr><th>Hospital / Patient</th><th>Requester</th><th>Blood type</th><th>Bags</th><th>Needed</th><th>Status / Evaluation</th><th th:if="${admin}">Admin action</th></tr></thead><tbody><tr th:each="request:${requests}"><td><strong th:text="${request.hospital}">Hospital</strong><br><span th:text="${request.patientName}">Patient</span><br><small th:text="${request.priority+' · '+(request.reason != null ? request.reason : 'No reason provided')}">Normal · Reason</small></td><td th:text="${request.requester}">Requester</td><td th:text="${request.bloodType}">O+</td><td th:text="${request.units}">1</td><td th:text="${request.neededDate}">Date</td><td><strong th:text="${request.status}">Pending</strong><br><small th:text="${request.evaluation}">Evaluation</small><br><small th:if="${request.dispatchedAt != null}" th:text="${'Dispatched: '+request.dispatchedAt+' · '+request.dispatchedUnits+' bags'}"></small></td><td th:if="${admin}"><form th:action="@{/requests/{id}/status(id=${request.id})}" method="post" class="request-admin-form"><label>Status<select name="status"><option value="APPROVED">Approve</option><option value="REJECTED">Reject</option><option value="SCHEDULED_FOR_DISPATCH">Schedule dispatch</option><option value="DISPATCHED">Mark dispatched</option><option value="FULFILLED">Fulfilled</option></select></label><label>Dispatch date<input type="date" name="scheduledDispatchDate"></label><label>Delivery date<input type="date" name="deliveryDate"></label><label>Bags to dispatch<input type="number" name="dispatchUnits" min="1" th:attr="max=${request.units}" th:value="${request.units}"></label><label>Dispatch notes<input name="dispatchNotes" maxlength="500"></label><button class="primary-button" type="submit">Update</button></form></td></tr><tr th:if="${#lists.isEmpty(requests)}"><td th:attr="colspan=${admin ? 7 : 6}">No blood requests have been submitted.</td></tr></tbody></table></div></section></main></div><script src="/js/theme.js"></script></body></html>
