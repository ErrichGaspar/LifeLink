
spring.application.name=lifelink

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:lifelink}?sslMode=REQUIRED
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

# Override this default in production with a protected environment variable.
lifelink.admin.invite-code=${LIFELINK_ADMIN_INVITE_CODE:LIFELINK-ADMIN-2026}
lifelink.requests.auto-approve=${LIFELINK_AUTO_APPROVE_REQUESTS:false}
