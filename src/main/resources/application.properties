
spring.application.name=lifelink

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:lifelink}?sslMode=REQUIRED
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

# Optional secure admin provisioning and request policy. Keep the invitation code in environment configuration.
lifelink.admin.invite-code=${LIFELINK_ADMIN_INVITE_CODE:}
lifelink.requests.auto-approve=${LIFELINK_AUTO_APPROVE_REQUESTS:false}
